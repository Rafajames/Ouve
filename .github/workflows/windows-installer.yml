name: Instalador Windows

on:
  push:
    branches: ["desenvolvimento/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  WHISPER_CPP_TAG: v1.9.5

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Transcrição local (D-082): usa o pacote oficial do whisper.cpp (MIT) para Windows x64, numa versão fixa.
      # Ele escolhe em tempo de execução a variante certa para o processador (AVX2, AVX, SSE…).
      - name: Baixar whisper.cpp oficial
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release oficial mais recente que traz o pacote pronto para Windows x64.
          $tag = gh api repos/ggml-org/whisper.cpp/releases --jq '[.[] | select(.assets[].name == "whisper-bin-x64.zip")][0].tag_name'
          if (-not $tag) { throw "Nenhuma release oficial do whisper.cpp com whisper-bin-x64.zip." }
          Write-Host "whisper.cpp oficial: $tag"
          gh release download $tag -R ggml-org/whisper.cpp -p whisper-bin-x64.zip -O whisper.zip
          Expand-Archive whisper.zip -DestinationPath wtmp
          $server = Get-ChildItem wtmp -Recurse -Filter whisper-server.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force apps/desktop/vendor/whisper | Out-Null
          Copy-Item $server.FullName apps/desktop/vendor/whisper/
          Copy-Item (Join-Path $server.DirectoryName "*.dll") apps/desktop/vendor/whisper/
          gh api "repos/ggml-org/whisper.cpp/contents/LICENSE?ref=$tag" -H "Accept: application/vnd.github.raw" > apps/desktop/vendor/whisper/LICENSE-whisper.cpp.txt
      - name: Conferir whisper-server
        shell: bash
        run: |
          ls -la apps/desktop/vendor/whisper
          ./apps/desktop/vendor/whisper/whisper-server.exe --help > help.txt 2>&1 || true
          head -5 help.txt
          grep -q -- "--inference-path" help.txt
      - name: Gerar instalador (NSIS, sem assinatura)
        run: pnpm --filter @ouve/desktop package
        env:
          FFMPEG_BIN: ffmpeg.exe
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Ouve-Setup-Windows
          path: apps/desktop/release/*.exe
      - name: Publicar versão de teste
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="teste-windows"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "Ouve — versão de teste para Windows" \
            --notes "Instalador gerado automaticamente a partir da branch de desenvolvimento. Não assinado: o Windows pode mostrar o aviso do SmartScreen (Mais informações → Executar assim mesmo). Não validado em uso real."
          gh release upload "$TAG" apps/desktop/release/*.exe --clobber
          gh release edit "$TAG" --target "$GITHUB_SHA" --notes "Instalador gerado automaticamente a partir do commit ${GITHUB_SHA::7} da branch ${GITHUB_REF_NAME}. Não assinado: o Windows pode mostrar o aviso do SmartScreen (Mais informações → Executar assim mesmo). Não validado em uso real."
