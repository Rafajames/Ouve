<!doctype html>
<html lang="pt-BR" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <title>Ouve</title>
  </head>
  <body>
    <main>
      <header>
        <span class="mark" aria-hidden="true">O</span>
        <h1>Ouve</h1>
      </header>
      <p>Transcreva o áudio desta aba. Somente o som é capturado; a aba continua tocando normalmente.</p>
      <div id="tab-section">
        <label
          ><input type="checkbox" id="consent" />
          <span>Tenho autorização para captar este áudio e sei que ele será enviado ao provedor de IA configurado.</span></label
        >
        <label><input type="checkbox" id="mic" /> <span>Incluir meu microfone</span></label>
        <button class="primary" id="capture" disabled>Capturar áudio desta aba</button>
      </div>
      <button id="open">Abrir o Ouve</button>
      <p id="status" role="status"></p>
      <script type="module" src="/src/popup.ts"></script>
    </main>
  </body>
</html>
