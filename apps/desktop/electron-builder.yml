# Instalador Windows (NSIS), gerado no GitHub Actions (windows-latest). Sem assinatura de código (P-033).
appId: br.ouve.desktop
productName: Ouve
copyright: "© 2026 Rafajames (github.com/Rafajames). Idealizado e desenvolvido por Rafajames."
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # Todo o código já vem empacotado pelo electron-vite; o ffmpeg vai como recurso externo.
  - "!node_modules/**"
extraResources:
  - from: node_modules/ffmpeg-static/${env.FFMPEG_BIN}
    to: ${env.FFMPEG_BIN}
  # Servidor do whisper.cpp (MIT), compilado no CI — ver D-082. A pasta pode estar vazia em builds locais.
  - from: vendor/whisper
    to: whisper
    filter: ["**/*", "!.gitkeep"]
npmRebuild: false
win:
  target: [nsis]
  artifactName: Ouve-Setup-${version}.${ext}
linux:
  target: [dir]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Ouve
  language: "1046"
